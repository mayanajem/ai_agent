name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: test
    runs-on: [self-hosted, portfolio-deploy]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $img = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLower()):latest"
          docker pull --platform linux/amd64 $img
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $existing = docker ps -aq --filter "name=^/ai-agent-app$"
          if ($existing) {
            docker rm -f ai-agent-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name ai-agent-app -p 127.0.0.1:8000:8000 -e GEMINI_API_KEY=$env:GEMINI_API_KEY $img
          exit $LASTEXITCODE

      - name: Deploy on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):latest"
          docker pull --platform linux/amd64 "$img"

          existing=$(docker ps -aq --filter "name=^/ai-agent-app$")
          if [ -n "$existing" ]; then
            docker rm -f ai-agent-app
          fi

          docker run -d --platform linux/amd64 --name ai-agent-app -p 127.0.0.1:8000:8000 -e GEMINI_API_KEY="$GEMINI_API_KEY" "$img"